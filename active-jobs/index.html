<title>לוח משרות פעילות</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Heebo:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first single column. Sticky header, status counters that double as filters, job cards grouped by client company, bottom-sheet editor. */
:root {
  --bg: #f3f4f7;
  --surface: #ffffff;
  --surface-2: #eceef4;
  --fg: #161a2b;
  --muted: #5d6380;
  --line: #dde0ea;
  --accent: #2f4fd8;
  --accent-fg: #ffffff;
  --ok: #157a4a;      --ok-bg: #dff3e8;
  --warn: #9a5b00;    --warn-bg: #fdf0d6;
  --hold: #4d5a7a;    --hold-bg: #e6e9f2;
  --off: #8a8fa3;     --off-bg: #eeeff3;
  --hot: #c2392b;     --hot-bg: #fbe4e1;
  --shadow: 0 1px 2px rgba(22,26,43,.06), 0 4px 14px rgba(22,26,43,.05);
  --f-display: "Rubik", "Heebo", system-ui, sans-serif;
  --f-body: "Heebo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1120; --surface: #171b2d; --surface-2: #20253b; --fg: #e9ebf5; --muted: #9ca2c0; --line: #2a3048;
  --accent: #7d94ff; --accent-fg: #0e1120;
  --ok: #5fd39a; --ok-bg: #143327; --warn: #f2b955; --warn-bg: #3a2c12; --hold: #a9b4d6; --hold-bg: #262c44;
  --off: #7c8199; --off-bg: #1e2236; --hot: #ff8a7a; --hot-bg: #3d1d1a;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0e1120; --surface: #171b2d; --surface-2: #20253b; --fg: #e9ebf5; --muted: #9ca2c0; --line: #2a3048;
  --accent: #7d94ff; --accent-fg: #0e1120;
  --ok: #5fd39a; --ok-bg: #143327; --warn: #f2b955; --warn-bg: #3a2c12; --hold: #a9b4d6; --hold-bg: #262c44;
  --off: #7c8199; --off-bg: #1e2236; --hot: #ff8a7a; --hot-bg: #3d1d1a;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 96px; }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; display: flex; flex-direction: column; gap: 12px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 22px; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
.btn { border: 0; border-radius: 999px; padding: 9px 16px; font-weight: 600; background: var(--accent); color: var(--accent-fg); white-space: nowrap; }
.btn.ghost { background: var(--surface-2); color: var(--fg); }
.btn.danger { background: var(--hot-bg); color: var(--hot); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.counts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.count { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 10px; text-align: start; display: flex; flex-direction: column; gap: 0; }
.count b { font-family: var(--f-display); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
.count span { font-size: 12px; color: var(--muted); }
.count[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.count.s-active b { color: var(--ok); } .count.s-verify b { color: var(--warn); }
.count.s-hold b { color: var(--hold); } .count.s-closed b { color: var(--off); }

.search { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; font: inherit; color: var(--fg); }

.note { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
#list { display: flex; flex-direction: column; gap: 18px; margin-top: 6px; }
.group { display: flex; flex-direction: column; gap: 8px; }
.group h2 { font-family: var(--f-display); font-size: 15px; font-weight: 600; margin: 0; display: flex; align-items: baseline; gap: 8px; }
.group h2 small { color: var(--muted); font-weight: 400; font-family: var(--f-body); font-size: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; text-align: start; width: 100%; }
.card.closed { opacity: .62; box-shadow: none; }
.card .role { font-weight: 600; font-size: 16px; min-width: 0; overflow-wrap: anywhere; }
.chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font-size: 12px; font-weight: 500; border-radius: 999px; padding: 2px 9px; background: var(--surface-2); color: var(--muted); }
.chip.active { background: var(--ok-bg); color: var(--ok); } .chip.verify { background: var(--warn-bg); color: var(--warn); }
.chip.hold { background: var(--hold-bg); color: var(--hold); } .chip.closed { background: var(--off-bg); color: var(--off); }
.chip.hot { background: var(--hot-bg); color: var(--hot); }
.chip.stale { background: transparent; color: var(--warn); padding-inline: 0; }
.pipe { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 52px; }
.pipe b { font-family: var(--f-display); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.pipe span { font-size: 11px; color: var(--muted); }
.memo { grid-column: 1 / -1; color: var(--muted); font-size: 13px; margin: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.empty { text-align: center; color: var(--muted); padding: 40px 12px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty strong { color: var(--fg); font-family: var(--f-display); font-size: 17px; }

/* Bottom sheet */
.scrim { position: fixed; inset: 0; background: rgba(10,12,24,.45); z-index: 20; }
.sheet { position: fixed; inset: auto 0 0 0; z-index: 21; background: var(--surface); border-radius: 18px 18px 0 0; max-height: 92%; overflow-y: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
.sheet form { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.sheet h3 { font-family: var(--f-display); margin: 0; font-size: 18px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row > * { min-width: 0; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .01em; }
.f input, .f textarea, .f select { font: inherit; font-size: 15px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; width: 100%; }
.f textarea { min-height: 84px; resize: vertical; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 4px; font-size: 13px; font-weight: 500; }
.seg button[aria-pressed="true"].active { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
.seg button[aria-pressed="true"].verify { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.seg button[aria-pressed="true"].hold { background: var(--hold-bg); color: var(--hold); border-color: var(--hold); }
.seg button[aria-pressed="true"].closed { background: var(--off-bg); color: var(--off); border-color: var(--off); }
.step { display: flex; align-items: center; gap: 8px; }
.step button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 18px; }
.step output { font-family: var(--f-display); font-size: 20px; min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; padding-top: 4px; }
.actions .end { display: flex; gap: 8px; }
.confirm { background: var(--hot-bg); color: var(--hot); border-radius: 10px; padding: 10px 12px; display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 14px; }
a.link { color: var(--accent); font-size: 13px; }
.toast { position: fixed; inset-inline: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; width: max-content; max-width: calc(100% - 32px); background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 14px; z-index: 30; }
@media (max-width: 420px) { .count b { font-size: 19px; } .row { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }
</style>

<div class="wrap" dir="rtl" lang="he">
  <header>
    <div class="top">
      <div>
        <h1>משרות פעילות</h1>
        <p class="sub" id="sub">טוען משרות…</p>
      </div>
      <button class="btn" id="addBtn" type="button">+ משרה</button>
    </div>
    <div class="counts" id="counts" role="group" aria-label="סינון לפי סטטוס"></div>
    <input class="search" id="q" type="search" placeholder="חיפוש לפי חברה, תפקיד או הערה" aria-label="חיפוש">
  </header>
  <div id="banner" class="note" hidden></div>
  <main id="list"></main>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle" dir="rtl" lang="he">
  <form id="form" autocomplete="off">
    <h3 id="sheetTitle">משרה חדשה</h3>
    <div class="row">
      <label class="f">חברה<input id="f-company" required maxlength="80"></label>
      <label class="f">תפקיד<input id="f-role" required maxlength="120"></label>
    </div>
    <div class="f" style="display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500">סטטוס
      <div class="seg" id="f-status" role="group" aria-label="סטטוס"></div>
    </div>
    <div class="row">
      <label class="f">מיקום / מודל עבודה<input id="f-location" maxlength="80" placeholder="ת״א, 5 ימים במשרד"></label>
      <div class="f" style="display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500">מועמדים בתהליך
        <div class="step"><button type="button" id="minus" aria-label="פחות">−</button><output id="f-cands">0</output><button type="button" id="plus" aria-label="יותר">+</button></div>
      </div>
    </div>
    <label class="check"><input type="checkbox" id="f-hot"> עדיפות גבוהה</label>
    <label class="f">קישור (Notion / משרה)<input id="f-link" type="url" inputmode="url" maxlength="400" placeholder="https://"></label>
    <label class="f">הערות<textarea id="f-memo" maxlength="2000" placeholder="מה חסר, מי בתהליך, צעד הבא"></textarea></label>
    <a class="link" id="openLink" href="#" target="_blank" rel="noopener" hidden>פתיחת הקישור</a>
    <div class="confirm" id="confirmDel" hidden><span>למחוק את המשרה לצמיתות?</span><span style="display:flex;gap:8px"><button type="button" class="btn danger" id="delYes">מחיקה</button><button type="button" class="btn ghost" id="delNo">ביטול</button></span></div>
    <div class="actions">
      <button type="button" class="btn danger" id="delBtn" hidden>מחיקה</button>
      <span class="end"><button type="button" class="btn ghost" id="cancel">ביטול</button><button type="submit" class="btn" id="save">שמירה</button></span>
    </div>
  </form>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const STATUSES = [
  { key: "active", label: "פעילה" },
  { key: "verify", label: "לאימות" },
  { key: "hold",   label: "בהמתנה" },
  { key: "closed", label: "נסגרה" },
];
const ORDER = { active: 0, verify: 1, hold: 2, closed: 3 };
const STALE_DAYS = 14;
const $ = (id) => document.getElementById(id);

let db = null, jobs = [], loaded = false, filter = "open", editing = null, formStatus = "active", cands = 0, readOnly = false;

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function daysAgo(iso) { const t = Date.parse(iso); if (!t) return null; return Math.floor((Date.now() - t) / 86400000); }
function agoText(d) { if (d == null) return ""; if (d <= 0) return "עודכן היום"; if (d === 1) return "עודכן אתמול"; return `עודכן לפני ${d} ימים`; }
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }
function safeUrl(u) { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ""; } catch { return ""; } }

function renderCounts() {
  const c = { active: 0, verify: 0, hold: 0, closed: 0 };
  jobs.forEach(j => { if (c[j.status] != null) c[j.status]++; });
  $("counts").innerHTML = STATUSES.map(s => {
    const pressed = filter === s.key || (filter === "open" && s.key !== "closed" && false);
    return `<button type="button" class="count s-${s.key}" data-f="${s.key}" aria-pressed="${filter === s.key}"><b>${c[s.key]}</b><span>${s.label}</span></button>`;
  }).join("");
  const open = c.active + c.verify + c.hold;
  const people = jobs.filter(j => j.status !== "closed").reduce((n, j) => n + (Number(j.candidates) || 0), 0);
  $("sub").textContent = loaded ? `${open} משרות פתוחות · ${people} מועמדים בתהליך` : "טוען משרות…";
}

function render() {
  renderCounts();
  const q = $("q").value.trim().toLowerCase();
  let list = jobs.filter(j => filter === "open" ? j.status !== "closed" : j.status === filter);
  if (q) list = list.filter(j => [j.company, j.role, j.memo, j.location].join(" ").toLowerCase().includes(q));
  list.sort((a, b) => (ORDER[a.status] - ORDER[b.status]) || ((b.hot ? 1 : 0) - (a.hot ? 1 : 0)) || String(b.updatedAt || "").localeCompare(String(a.updatedAt || "")));

  const el = $("list");
  if (!loaded) { el.innerHTML = `<div class="empty"><strong>טוען את המשרות…</strong><span>הרשימה מגיעה מהמאגר של הדף.</span></div>`; return; }
  if (!list.length) {
    const none = !jobs.length;
    el.innerHTML = `<div class="empty"><strong>${none ? "עוד אין משרות בלוח" : "אין משרות שמתאימות לסינון"}</strong><span>${none ? "לחיצה על ״+ משרה״ מוסיפה את הראשונה." : "אפשר לנקות את החיפוש או לבחור סטטוס אחר."}</span>${!none ? `<button type="button" class="btn ghost" id="clearF">הצגת כל הפתוחות</button>` : ""}</div>`;
    const cf = $("clearF"); if (cf) cf.onclick = () => { filter = "open"; $("q").value = ""; render(); };
    return;
  }
  const groups = new Map();
  list.forEach(j => { const k = j.company || "ללא חברה"; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(j); });
  el.innerHTML = [...groups].map(([company, items]) => `
    <section class="group"><h2>${esc(company)} <small>${items.length} ${items.length === 1 ? "משרה" : "משרות"}</small></h2>
    ${items.map(j => {
      const st = STATUSES.find(s => s.key === j.status) || STATUSES[1];
      const d = daysAgo(j.updatedAt);
      const stale = j.status === "active" && d != null && d >= STALE_DAYS;
      return `<button type="button" class="card ${j.status === "closed" ? "closed" : ""}" data-id="${esc(j.id)}">
        <span class="role">${esc(j.role)}</span>
        <span class="pipe" aria-label="מועמדים בתהליך"><b>${Number(j.candidates) || 0}</b><span>בתהליך</span></span>
        <span class="chips">
          <span class="chip ${st.key}">${st.label}</span>
          ${j.hot ? `<span class="chip hot">עדיפות גבוהה</span>` : ""}
          ${j.location ? `<span class="chip">${esc(j.location)}</span>` : ""}
          <span class="chip ${stale ? "stale" : ""}" style="${stale ? "" : "background:transparent;padding-inline:0"}">${stale ? `לא עודכן ${d} ימים` : agoText(d)}</span>
        </span>
        ${j.memo ? `<p class="memo">${esc(j.memo)}</p>` : ""}
      </button>`;
    }).join("")}</section>`).join("");
}

$("counts").addEventListener("click", e => {
  const b = e.target.closest("[data-f]"); if (!b) return;
  filter = filter === b.dataset.f ? "open" : b.dataset.f; render();
});
$("q").addEventListener("input", render);
$("list").addEventListener("click", e => { const c = e.target.closest(".card"); if (c) openSheet(jobs.find(j => j.id === c.dataset.id)); });

function paintStatus() {
  $("f-status").innerHTML = STATUSES.map(s => `<button type="button" class="${s.key}" data-s="${s.key}" aria-pressed="${formStatus === s.key}">${s.label}</button>`).join("");
}
$("f-status").addEventListener("click", e => { const b = e.target.closest("[data-s]"); if (b) { formStatus = b.dataset.s; paintStatus(); } });
$("minus").onclick = () => { cands = Math.max(0, cands - 1); $("f-cands").textContent = cands; };
$("plus").onclick = () => { cands = Math.min(99, cands + 1); $("f-cands").textContent = cands; };

function openSheet(job) {
  editing = job || null;
  $("sheetTitle").textContent = job ? "עריכת משרה" : "משרה חדשה";
  $("f-company").value = job?.company || "";
  $("f-role").value = job?.role || "";
  $("f-location").value = job?.location || "";
  $("f-link").value = job?.link || "";
  $("f-memo").value = job?.memo || "";
  $("f-hot").checked = !!job?.hot;
  formStatus = job?.status || "active"; paintStatus();
  cands = Number(job?.candidates) || 0; $("f-cands").textContent = cands;
  const u = safeUrl(job?.link || ""); $("openLink").hidden = !u; if (u) $("openLink").href = u;
  $("delBtn").hidden = !job || readOnly; $("confirmDel").hidden = true;
  $("save").disabled = readOnly;
  $("scrim").hidden = false; $("sheet").hidden = false;
  if (!job) setTimeout(() => $("f-company").focus(), 50);
}
function closeSheet() { $("scrim").hidden = true; $("sheet").hidden = true; editing = null; }
$("addBtn").onclick = () => openSheet(null);
$("cancel").onclick = closeSheet; $("scrim").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });
$("delBtn").onclick = () => { $("confirmDel").hidden = false; };
$("delNo").onclick = () => { $("confirmDel").hidden = true; };
$("delYes").onclick = async () => {
  if (!db || !editing) return;
  try { await db.collection("jobs").doc(editing.id).delete(); closeSheet(); toast("המשרה נמחקה"); }
  catch (e) { toast(errText(e)); }
};

function errText(e) {
  if (e?.code === "invalid_argument") { readOnly = true; return "אין לך הרשאת עריכה בדף הזה"; }
  if (e?.code === "quota_exceeded") return "המאגר מלא. כדאי למחוק משרות ישנות שנסגרו";
  return "השמירה לא הצליחה. נסה שוב בעוד רגע";
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  if (!db) { toast("המאגר עדיין לא מחובר"); return; }
  const body = {
    company: $("f-company").value.trim(),
    role: $("f-role").value.trim(),
    status: formStatus,
    location: $("f-location").value.trim(),
    link: $("f-link").value.trim(),
    memo: $("f-memo").value.trim(),
    hot: $("f-hot").checked,
    candidates: cands,
    updatedAt: new Date().toISOString(),
  };
  if (!body.company || !body.role) { toast("צריך למלא חברה ותפקיד"); return; }
  $("save").disabled = true;
  try {
    const col = db.collection("jobs");
    if (editing) await col.doc(editing.id).update(body);
    else await col.add({ ...body, createdAt: body.updatedAt });
    closeSheet(); toast(editing ? "נשמר" : "המשרה נוספה");
  } catch (err) { toast(errText(err)); }
  finally { $("save").disabled = readOnly; }
});

render();

(async () => {
  const banner = $("banner");
  db = await (window.claude?.use ? window.claude.use("db") : Promise.resolve(null));
  if (!db) {
    loaded = true; render();
    banner.textContent = "המאגר לא זמין בתצוגה הזו. פתח את הדף מתוך Claude כשאתה מחובר כדי לראות ולעדכן משרות.";
    banner.hidden = false; $("addBtn").hidden = true; return;
  }
  const timer = setTimeout(() => { banner.textContent = "המשרות עוד לא נטענו. ייתכן שהחיבור איטי, הדף ימשיך לנסות."; banner.hidden = false; }, 10000);
  db.collection("jobs").onSnapshot(snap => {
    jobs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    loaded = true;
    if (!snap.metadata.fromCache) { clearTimeout(timer); banner.hidden = true; }
    render();
  }, err => {
    clearTimeout(timer); loaded = true; render();
    banner.textContent = "אין גישה למשרות כרגע. רענון הדף בעוד רגע אמור לפתור את זה.";
    banner.hidden = false;
  });
})();
</script>
