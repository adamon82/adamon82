<title>לוח משרות פעילות</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap">
<style>
/* Layout: iOS-style grouped inset list. Large title that collapses into a blurred nav bar, filter pills, a "needs attention" group, then one rounded card per company (or per status) with expandable rows. Floating add button at thumb reach. */
:root {
  --bg: #f4f4f8;
  --card: #ffffff;
  --fill: #eeeef3;
  --fill-2: #e4e4ec;
  --fg: #1c1c1e;
  --muted: #8a8a93;
  --sep: rgba(60, 60, 67, .12);
  --tint: #6c7be8;
  --tint-soft: #ebedfc;
  --on-tint: #ffffff;
  --nav: rgba(244, 244, 248, .82);
  --active: #2f9e6e;  --active-bg: #e3f4ec;
  --verify: #c4801f;  --verify-bg: #fcefdb;
  --hold: #7b80a8;    --hold-bg: #ecedf6;
  --closed: #a2a2aa;  --closed-bg: #f0f0f2;
  --hot: #de6a5f;     --hot-bg: #fde9e7;
  --shadow: 0 1px 2px rgba(28, 28, 30, .04), 0 8px 24px rgba(28, 28, 30, .05);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Heebo", system-ui, "Segoe UI", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Heebo", system-ui, sans-serif;
  --r-card: 22px;
  --r-ctl: 14px;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --card: #1c1c1e; --fill: #2c2c2e; --fill-2: #3a3a3c; --fg: #f2f2f7; --muted: #8e8e93; --sep: rgba(84, 84, 88, .5);
  --tint: #929dff; --tint-soft: rgba(146, 157, 255, .16); --on-tint: #0b0b12; --nav: rgba(0, 0, 0, .78);
  --active: #63d3a1; --active-bg: rgba(99, 211, 161, .14); --verify: #f0b864; --verify-bg: rgba(240, 184, 100, .14);
  --hold: #a9aed6; --hold-bg: rgba(169, 174, 214, .14); --closed: #7c7c84; --closed-bg: rgba(124, 124, 132, .16);
  --hot: #ff8c80; --hot-bg: rgba(255, 140, 128, .15); --shadow: none; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #000000; --card: #1c1c1e; --fill: #2c2c2e; --fill-2: #3a3a3c; --fg: #f2f2f7; --muted: #8e8e93; --sep: rgba(84, 84, 88, .5);
  --tint: #929dff; --tint-soft: rgba(146, 157, 255, .16); --on-tint: #0b0b12; --nav: rgba(0, 0, 0, .78);
  --active: #63d3a1; --active-bg: rgba(99, 211, 161, .14); --verify: #f0b864; --verify-bg: rgba(240, 184, 100, .14);
  --hold: #a9aed6; --hold-bg: rgba(169, 174, 214, .14); --closed: #7c7c84; --closed-bg: rgba(124, 124, 132, .16);
  --hot: #ff8c80; --hot-bg: rgba(255, 140, 128, .15); --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--nav); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; border-radius: 10px; }

/* Nav bar */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: transparent; transition: background .25s var(--ease), box-shadow .25s var(--ease); }
.nav.solid { background: var(--nav); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); box-shadow: 0 .5px 0 var(--sep); }
.nav-in { max-width: 680px; margin: 0 auto; height: 48px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.nav-title { font-weight: 600; font-size: 17px; opacity: 0; transform: translateY(4px); transition: opacity .2s var(--ease), transform .2s var(--ease); white-space: nowrap; }
.nav.solid .nav-title { opacity: 1; transform: none; }
.seg-mini { justify-self: start; display: inline-flex; background: var(--fill); border-radius: 10px; padding: 2px; }
.seg-mini button { font-size: 13px; font-weight: 500; padding: 5px 11px; border-radius: 8px; color: var(--muted); transition: background .2s var(--ease), color .2s var(--ease); }
.seg-mini button[aria-pressed="true"] { background: var(--card); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 120px; display: flex; flex-direction: column; gap: 14px; }
.hero { display: flex; flex-direction: column; gap: 2px; padding-top: 2px; }
h1 { font-family: var(--font-display); font-size: 34px; font-weight: 700; letter-spacing: -.02em; margin: 0; line-height: 1.15; }
.sub { color: var(--muted); font-size: 15px; margin: 0; font-variant-numeric: tabular-nums; }

.search { position: relative; }
.search svg { position: absolute; inset-inline-start: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
.search input { width: 100%; border: 0; background: var(--fill); border-radius: 12px; padding: 9px 12px; padding-inline-start: 34px; font: inherit; font-size: 16px; color: var(--fg); }
.search input::placeholder { color: var(--muted); }

.pills { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; padding-block: 2px; }
.pills::-webkit-scrollbar { display: none; }
.pill { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); font-size: 14px; font-weight: 500; color: var(--fg); transition: background .2s var(--ease), color .2s var(--ease); }
.pill .n { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 500; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill[aria-pressed="true"] { background: var(--tint); color: var(--on-tint); box-shadow: none; }
.pill[aria-pressed="true"] .n { color: inherit; opacity: .8; }
.pill.active .dot { color: var(--active); } .pill.verify .dot { color: var(--verify); } .pill.hold .dot { color: var(--hold); } .pill.closed .dot { color: var(--closed); }
.pill[aria-pressed="true"] .dot { color: var(--on-tint); }

.banner { background: var(--verify-bg); color: var(--verify); border-radius: var(--r-ctl); padding: 11px 14px; font-size: 14px; }

/* Grouped sections */
.section { display: flex; flex-direction: column; gap: 7px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding-inline: 4px; }
.sec-h h2 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; margin: 0; font-family: var(--font-display); }
.sec-h span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card { background: var(--card); border-radius: var(--r-card); box-shadow: var(--shadow); overflow: hidden; }

.row { position: relative; display: block; width: 100%; text-align: start; padding: 13px 16px; padding-inline-start: 22px; }
.row + .row::after, .row + .item::after, .item + .item::after { content: ""; position: absolute; top: 0; inset-inline: 22px 0; height: .5px; background: var(--sep); }
.item { position: relative; }
.row::before { content: ""; position: absolute; inset-inline-start: 9px; top: 15px; bottom: 15px; width: 4px; border-radius: 4px; background: var(--c, var(--closed)); opacity: .85; }
.row.s-active { --c: var(--active); --cb: var(--active-bg); } .row.s-verify { --c: var(--verify); --cb: var(--verify-bg); }
.row.s-hold { --c: var(--hold); --cb: var(--hold-bg); } .row.s-closed { --c: var(--closed); --cb: var(--closed-bg); }
.row-main { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; align-items: center; }
.row-title { font-size: 16px; font-weight: 600; min-width: 0; overflow-wrap: anywhere; display: flex; align-items: center; gap: 7px; }
.row-sub { grid-column: 1; font-size: 13px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.row-sub .warn { color: var(--verify); }
.row-side { grid-row: 1 / span 2; grid-column: 2; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.status { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--cb); color: var(--c); white-space: nowrap; }
.hotdot { width: 8px; height: 8px; border-radius: 50%; background: var(--hot); flex: none; }
.pipe { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { display: inline-flex; gap: 2px; width: 46px; height: 5px; }
.bar i { flex: 1; border-radius: 3px; background: var(--fill-2); }
.bar i.on1 { background: var(--tint); opacity: .45; } .bar i.on2 { background: var(--tint); opacity: .72; } .bar i.on3 { background: var(--tint); }
.row.s-closed .row-title { color: var(--muted); }

/* Expanded quick panel */
.quick { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s var(--ease); }
.item.open .quick { grid-template-rows: 1fr; }
.quick > div { overflow: hidden; }
.quick-in { padding: 2px 16px 16px; padding-inline-start: 22px; display: flex; flex-direction: column; gap: 12px; }
.segc { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--fill); border-radius: 11px; padding: 2px; gap: 2px; }
.segc button { font-size: 13px; font-weight: 500; padding: 7px 2px; border-radius: 9px; color: var(--muted); transition: background .2s var(--ease), color .2s var(--ease); }
.segc button[aria-pressed="true"] { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.segc button[aria-pressed="true"][data-s="active"] { color: var(--active); } .segc button[aria-pressed="true"][data-s="verify"] { color: var(--verify); }
.segc button[aria-pressed="true"][data-s="hold"] { color: var(--hold); } .segc button[aria-pressed="true"][data-s="closed"] { color: var(--closed); }
.stages { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.stage { background: var(--fill); border-radius: var(--r-ctl); padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.stage small { font-size: 12px; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 2px; }
.stepper button { width: 28px; height: 28px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-size: 18px; line-height: 1; color: var(--tint); }
.stepper button:active { transform: scale(.92); }
.stepper b { min-width: 2ch; text-align: center; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.memo { margin: 0; font-size: 14px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.quick-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.tbtn { padding: 8px 14px; border-radius: 999px; background: var(--tint-soft); color: var(--tint); font-size: 14px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; }

/* Attention */
.att .row { padding-block: 11px; }
.att-more { font-size: 13px; color: var(--muted); padding: 10px 22px 12px; }

.empty { text-align: center; color: var(--muted); padding: 48px 16px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.empty strong { color: var(--fg); font-size: 17px; font-weight: 600; }

/* FAB */
.fab { position: fixed; z-index: 8; inset-inline-start: calc(20px + env(safe-area-inset-right, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; border-radius: 50%;
  background: var(--tint); color: var(--on-tint); display: grid; place-items: center; box-shadow: 0 8px 24px rgba(108, 123, 232, .35), 0 2px 6px rgba(0,0,0,.08); transition: transform .2s var(--ease); }
.fab:active { transform: scale(.94); }
.fab svg { width: 24px; height: 24px; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .3); z-index: 20; opacity: 0; transition: opacity .25s var(--ease); }
.scrim.show { opacity: 1; }
.sheet { position: fixed; inset: auto 0 0 0; z-index: 21; background: var(--bg); border-radius: 22px 22px 0 0; max-height: 94%; overflow-y: auto; transform: translateY(100%); transition: transform .32s var(--ease);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px calc(20px + env(safe-area-inset-bottom, 0px)); }
.sheet.show { transform: none; }
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--fill-2); margin: 0 auto 6px; }
.sheet form { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.sheet-h { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 44px; }
.sheet-h h3 { margin: 0; font-size: 17px; font-weight: 600; }
.sheet-h .l { justify-self: start; color: var(--tint); font-size: 17px; }
.sheet-h .r { justify-self: end; color: var(--tint); font-size: 17px; font-weight: 600; }
.sheet-h .r:disabled { opacity: .4; }
.group { background: var(--card); border-radius: var(--r-ctl); overflow: hidden; }
.field { display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 48px; position: relative; }
.field + .field::before { content: ""; position: absolute; top: 0; inset-inline: 16px 0; height: .5px; background: var(--sep); }
.field label, .field .lbl { flex: none; width: 92px; font-size: 15px; color: var(--fg); }
.field input, .field textarea { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 16px; color: var(--fg); padding: 13px 0; }
.field textarea { min-height: 90px; resize: vertical; }
.field.col { flex-direction: column; align-items: stretch; gap: 0; padding-top: 10px; }
.field.col .lbl { width: auto; font-size: 13px; color: var(--muted); }
.cap { font-size: 13px; color: var(--muted); padding-inline: 16px; margin: -8px 0 0; text-transform: none; }
.switch { position: relative; width: 51px; height: 31px; flex: none; margin-inline-start: auto; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--fill-2); transition: background .2s var(--ease); }
.switch span::after { content: ""; position: absolute; top: 2px; inset-inline-start: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.18); transition: transform .22s var(--ease); }
.switch input:checked + span { background: var(--active); }
.switch input:checked + span::after { transform: translateX(-20px); }
.switch input:focus-visible + span { outline: 2px solid var(--tint); outline-offset: 2px; }
.del { width: 100%; background: var(--card); color: var(--hot); border-radius: var(--r-ctl); padding: 14px; font-size: 16px; font-weight: 500; }
.confirm { background: var(--card); border-radius: var(--r-ctl); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; text-align: center; font-size: 14px; color: var(--muted); }
.confirm div { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.confirm button { padding: 11px; border-radius: 12px; font-weight: 600; background: var(--fill); }
.confirm .yes { background: var(--hot-bg); color: var(--hot); }

.toast { position: fixed; inset-inline: 0; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; width: max-content; max-width: calc(100% - 32px); background: var(--card); color: var(--fg); padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 500; z-index: 30; box-shadow: 0 8px 30px rgba(0,0,0,.14); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>

<nav class="nav" id="nav" dir="rtl" lang="he">
  <div class="nav-in">
    <span></span>
    <span class="nav-title">משרות פעילות</span>
    <div class="seg-mini" role="group" aria-label="תצוגה">
      <button type="button" data-v="company" aria-pressed="true">חברה</button>
      <button type="button" data-v="status" aria-pressed="false">סטטוס</button>
    </div>
  </div>
</nav>

<div class="wrap" dir="rtl" lang="he">
  <div class="hero" id="hero">
    <h1>משרות פעילות</h1>
    <p class="sub" id="sub">טוען…</p>
  </div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    <input id="q" type="search" placeholder="חיפוש" aria-label="חיפוש לפי חברה, תפקיד או הערה">
  </div>
  <div class="pills" id="pills" role="group" aria-label="סינון לפי סטטוס"></div>
  <div class="banner" id="banner" hidden></div>
  <div id="attention"></div>
  <main id="list" style="display:flex;flex-direction:column;gap:22px"></main>
</div>

<button class="fab" id="fab" type="button" aria-label="משרה חדשה" dir="rtl">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</button>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle" dir="rtl" lang="he">
  <div class="grab"></div>
  <form id="form" autocomplete="off">
    <div class="sheet-h">
      <button type="button" class="l" id="cancel">ביטול</button>
      <h3 id="sheetTitle">משרה חדשה</h3>
      <button type="submit" class="r" id="save">שמירה</button>
    </div>
    <div class="group">
      <div class="field"><label for="f-company">חברה</label><input id="f-company" required maxlength="80" placeholder="שם החברה"></div>
      <div class="field"><label for="f-role">תפקיד</label><input id="f-role" required maxlength="120" placeholder="למשל Team Lead Backend"></div>
      <div class="field"><label for="f-location">מיקום</label><input id="f-location" maxlength="80" placeholder="ת״א, היברידי"></div>
    </div>
    <div class="segc" id="f-status" role="group" aria-label="סטטוס"></div>
    <div class="stages" id="f-stages"></div>
    <div class="group">
      <div class="field"><span class="lbl">עדיפות גבוהה</span><span class="switch"><input type="checkbox" id="f-hot" aria-label="עדיפות גבוהה"><span></span></span></div>
      <div class="field"><label for="f-link">קישור</label><input id="f-link" type="url" inputmode="url" maxlength="400" placeholder="Notion או דף המשרה" dir="ltr" style="text-align:right"></div>
    </div>
    <div class="group">
      <div class="field col"><label class="lbl" for="f-memo">הערות</label><textarea id="f-memo" maxlength="2000" placeholder="מי בתהליך, מה חסר, הצעד הבא"></textarea></div>

    <div class="confirm" id="confirmDel" hidden>
      <span>המשרה תסומן כנסגרה ותישאר ב-Notion.</span>
      <div><button type="button" id="delNo">ביטול</button><button type="button" class="yes" id="delYes">סגירה</button></div>
    </div>
  </form>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const STATUSES = [
  { key: "active", label: "פעילה" },
  { key: "verify", label: "לאימות" },
  { key: "hold",   label: "בהמתנה" },
  { key: "closed", label: "נסגרה" },
];
const STAGES = [
  { key: "outreach",  label: "פנייה" },
  { key: "interview", label: "ראיון" },
  { key: "offer",     label: "הצעה" },
];
const ORDER = { active: 0, verify: 1, hold: 2, closed: 3 };
const STALE_DAYS = 14;
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

let raw = [], loaded = false, readOnly = false;
let filter = store.get("jobs.filter", "open");
let view = store.get("jobs.view", "company");
let openId = null, editing = null, form = { status: "active", stages: { outreach: 0, interview: 0, offer: 0 } };
const pending = {}, timers = {}, inflight = {};

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function daysAgo(iso) { const t = Date.parse(iso); return t ? Math.max(0, Math.floor((Date.now() - t) / 86400000)) : null; }
function agoText(d) { if (d == null) return ""; if (d === 0) return "היום"; if (d === 1) return "אתמול"; return `לפני ${d} ימים`; }
function safeUrl(u) { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ""; } catch { return ""; } }
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }
function stLabel(k) { return (STATUSES.find(s => s.key === k) || STATUSES[1]).label; }

function norm(j) {
  const s = j.stages && typeof j.stages === "object" ? j.stages : { outreach: Number(j.candidates) || 0, interview: 0, offer: 0 };
  const stages = { outreach: +s.outreach || 0, interview: +s.interview || 0, offer: +s.offer || 0 };
  const status = ORDER[j.status] != null ? j.status : "verify";
  return { ...j, status, stages, total: stages.outreach + stages.interview + stages.offer };
}
function jobs() { return raw.map(j => norm({ ...j, ...(pending[j.id] || {}) })); }
function isStale(j) { const d = daysAgo(j.updatedAt); return j.status === "active" && d != null && d >= STALE_DAYS; }

/* ---------- rendering ---------- */
function rowHtml(j, opts = {}) {
  const d = daysAgo(j.updatedAt);
  const stale = isStale(j);
  const title = opts.showCompany ? `${esc(j.role)}` : esc(j.role);
  const subParts = [];
  if (opts.showCompany) subParts.push(esc(j.company));
  if (j.location) subParts.push(esc(j.location));
  subParts.push(stale ? `<span class="warn">לא עודכן ${d} ימים</span>` : esc(agoText(d)));
  const lv = (n, k) => n > 0 ? `on${k}` : "";
  return `
    <button type="button" class="row s-${j.status}" data-id="${esc(j.id)}" aria-expanded="${openId === j.id}">
      <span class="row-main">
        <span class="row-title">${j.hot ? `<i class="hotdot" aria-label="עדיפות גבוהה"></i>` : ""}${title}</span>
        <span class="row-side">
          <span class="status">${stLabel(j.status)}</span>
          <span class="pipe">${j.total ? `${j.total}` : "—"}<span class="bar" aria-hidden="true"><i class="${lv(j.stages.outreach, 1)}"></i><i class="${lv(j.stages.interview, 2)}"></i><i class="${lv(j.stages.offer, 3)}"></i></span></span>
        </span>
        <span class="row-sub">${subParts.filter(Boolean).join(" · ")}</span>
      </span>
    </button>`;
}
function quickHtml(j) {
  const link = safeUrl(j.link);
  return `<div class="quick"><div><div class="quick-in">
    <div class="segc" role="group" aria-label="סטטוס">${STATUSES.map(s => `<button type="button" data-q="status" data-s="${s.key}" data-id="${esc(j.id)}" aria-pressed="${j.status === s.key}" ${readOnly ? "disabled" : ""}>${s.label}</button>`).join("")}</div>
    <div class="stages">${STAGES.map(st => `<div class="stage"><small>${st.label}</small><div class="stepper">
      <button type="button" data-q="dec" data-k="${st.key}" data-id="${esc(j.id)}" aria-label="${st.label} פחות" ${readOnly ? "disabled" : ""}>−</button>
      <b>${j.stages[st.key]}</b>
      <button type="button" data-q="inc" data-k="${st.key}" data-id="${esc(j.id)}" aria-label="${st.label} יותר" ${readOnly ? "disabled" : ""}>+</button>
    </div></div>`).join("")}</div>
    ${j.memo ? `<p class="memo">${esc(j.memo)}</p>` : ""}
    <div class="quick-actions">
      <button type="button" class="tbtn" data-q="edit" data-id="${esc(j.id)}">עריכה</button>
      ${link ? `<a class="tbtn" href="${esc(link)}" target="_blank" rel="noopener">פתיחה ב-Notion</a>` : ""}
    </div>
  </div></div></div>`;
}
function itemHtml(j, opts) { return `<div class="item ${openId === j.id ? "open" : ""}">${rowHtml(j, opts)}${quickHtml(j)}</div>`; }

function sortJobs(list) {
  return list.sort((a, b) => (ORDER[a.status] - ORDER[b.status]) || ((b.hot ? 1 : 0) - (a.hot ? 1 : 0)) || String(b.updatedAt || "").localeCompare(String(a.updatedAt || "")));
}

function render() {
  const all = jobs();
  const c = { active: 0, verify: 0, hold: 0, closed: 0 };
  all.forEach(j => c[j.status]++);
  const open = c.active + c.verify + c.hold;
  const people = all.filter(j => j.status !== "closed").reduce((n, j) => n + j.total, 0);
  $("sub").textContent = loaded ? `${open} פתוחות · ${people} מועמדים בתהליך` : "טוען…";

  $("pills").innerHTML = [{ key: "open", label: "הפתוחות", n: open }, ...STATUSES.map(s => ({ ...s, n: c[s.key] }))]
    .map(p => `<button type="button" class="pill ${p.key}" data-f="${p.key}" aria-pressed="${filter === p.key}">${p.key !== "open" ? `<i class="dot"></i>` : ""}${p.label}<span class="n">${p.n}</span></button>`).join("");
  document.querySelectorAll(".seg-mini button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === view)));

  const q = $("q").value.trim().toLowerCase();
  const match = j => !q || [j.company, j.role, j.memo, j.location].join(" ").toLowerCase().includes(q);

  // Needs attention: verify + stale active
  const att = sortJobs(all.filter(j => (j.status === "verify" || isStale(j)) && match(j)));
  const showAtt = loaded && att.length && filter === "open";
  $("attention").innerHTML = showAtt ? `
    <section class="section att"><div class="sec-h"><h2>דורש טיפול</h2><span>${att.length}</span></div>
      <div class="card">${att.slice(0, 4).map(j => `<div class="item">${rowHtml(j, { showCompany: true }).replace('class="row', 'data-jump="1" class="row')}</div>`).join("")}
      ${att.length > 4 ? `<div class="att-more">ועוד ${att.length - 4} משרות</div>` : ""}</div>
    </section>` : "";

  const el = $("list");
  if (!loaded) { el.innerHTML = `<div class="empty"><strong>טוען את המשרות</strong><span>זה לוקח שנייה.</span></div>`; return; }
  let list = all.filter(j => (filter === "open" ? j.status !== "closed" : j.status === filter) && match(j));
  if (!list.length) {
    el.innerHTML = all.length
      ? `<div class="empty"><strong>אין כאן משרות</strong><span>נסה סינון אחר או נקה את החיפוש.</span></div>`
      : `<div class="empty"><strong>הלוח ריק</strong><span>הכפתור + בפינה מוסיף משרה ראשונה.</span></div>`;
    return;
  }
  sortJobs(list);
  const groups = new Map();
  if (view === "status") {
    STATUSES.forEach(s => groups.set(s.label, []));
    list.forEach(j => groups.get(stLabel(j.status)).push(j));
  } else {
    list.forEach(j => { const k = j.company || "ללא חברה"; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(j); });
  }
  el.innerHTML = [...groups].filter(([, items]) => items.length).map(([name, items]) => {
    const total = items.reduce((n, j) => n + j.total, 0);
    return `<section class="section"><div class="sec-h"><h2>${esc(name)}</h2><span>${items.length} ${items.length === 1 ? "משרה" : "משרות"}${total ? ` · ${total} מועמדים` : ""}</span></div>
      <div class="card">${items.map(j => itemHtml(j, { showCompany: view === "status" })).join("")}</div></section>`;
  }).join("");
}

/* ---------- Notion data layer ---------- */
const NOTION = "Notion";
const DS = "collection://4c9b4c8f-c6d5-4655-9411-646a1ae53fd3";
const DS_ID = "4c9b4c8f-c6d5-4655-9411-646a1ae53fd3";
const SQL = `SELECT url, "Role", "Company", "Status", "Outreach", "Interview", "Offer", "Hot", "Location", "Notes", "Link", "date:Updated:start", "Updated by", "Last edited" FROM "${DS}"`;
const QUERY_INPUT = { data: { data_source_urls: [DS], query: SQL } };
const ST_TO_HE = { active: "פעילה", verify: "לאימות", hold: "בהמתנה", closed: "נסגרה" };
const HE_TO_ST = { "פעילה": "active", "לאימות": "verify", "בהמתנה": "hold", "נסגרה": "closed" };
let mcp = null;

function pageId(url) { const m = String(url || "").match(/([0-9a-f]{32})/i); return m ? m[1] : String(url || ""); }
function fromRow(r) {
  return {
    id: pageId(r.url), url: r.url,
    role: r.Role || "", company: r.Company || "", status: HE_TO_ST[r.Status] || "verify",
    stages: { outreach: +r.Outreach || 0, interview: +r.Interview || 0, offer: +r.Offer || 0 },
    hot: r.Hot === "__YES__", location: r.Location || "", memo: r.Notes || "", link: r.Link || "",
    updatedAt: r["date:Updated:start"] || r["Last edited"] || "", updatedBy: r["Updated by"] || "",
  };
}
function toProps(p) {
  const o = {};
  if ("role" in p) o.Role = p.role;
  if ("company" in p) o.Company = p.company;
  if ("status" in p) o.Status = ST_TO_HE[p.status];
  if (p.stages) { o.Outreach = p.stages.outreach; o.Interview = p.stages.interview; o.Offer = p.stages.offer; }
  if ("hot" in p) o.Hot = p.hot ? "__YES__" : "__NO__";
  if ("location" in p) o.Location = p.location;
  if ("memo" in p) o.Notes = p.memo;
  if ("link" in p) o.Link = p.link || null;
  o["date:Updated:start"] = p.updatedAt || new Date().toISOString();
  o["date:Updated:is_datetime"] = 1;
  o["Updated by"] = "אדם (לוח)";
  return o;
}
function applyRows(payload) {
  const rows = Array.isArray(payload?.results) ? payload.results : null;
  if (!rows) return false;
  raw = rows.map(fromRow); loaded = true; $("banner").hidden = true; render(); return true;
}
async function refreshNow() {
  try { await mcp.invalidate(NOTION, "notion-query-data-sources"); } catch {}
}

/* ---------- quick writes (coalesced, one write at a time per page) ---------- */
function queue(id, patch) {
  if (readOnly || !mcp) return;
  const base = norm({ ...(raw.find(j => j.id === id) || {}), ...(pending[id] || {}) });
  const next = { ...(pending[id] || {}), ...patch, updatedAt: new Date().toISOString() };
  const stages = next.stages || base.stages;
  next.candidates = stages.outreach + stages.interview + stages.offer;
  pending[id] = next;
  render();
  clearTimeout(timers[id]);
  timers[id] = setTimeout(() => flush(id), 650);
}
async function flush(id) {
  if (inflight[id]) { timers[id] = setTimeout(() => flush(id), 400); return; }
  const p = pending[id]; if (!p) return;
  inflight[id] = true;
  try {
    await mcp.callTool(NOTION, "notion-update-page", { page_id: id, command: "update_properties", properties: toProps(p), allow_async: false });
    raw = raw.map(j => j.id === id ? { ...j, ...p } : j);
    if (pending[id] === p) delete pending[id];
    refreshNow();
  }
  catch (e) { delete pending[id]; toast(errText(e)); }
  finally { inflight[id] = false; render(); }
}
function errText(e) {
  switch (e?.code) {
    case "needs_reauth": return "צריך לחבר מחדש את Notion בהגדרות Claude › Connectors";
    case "server_not_connected": return "Notion לא מחובר. מוסיפים אותו בהגדרות Claude › Connectors";
    case "not_in_manifest": case "approval_required": return "הלוח צריך אישור לגשת ל-Notion";
    case "blocked_by_policy": readOnly = true; return "הארגון חוסם עריכה ב-Notion מהלוח";
    case "tool_error": return "Notion סירב לשינוי. נסה שוב או ערוך ישירות ב-Notion";
    default: return "השמירה לא הושלמה. בדוק ב-Notion לפני שמנסים שוב";
  }
}

/* ---------- events ---------- */
$("pills").addEventListener("click", e => { const b = e.target.closest("[data-f]"); if (!b) return; filter = b.dataset.f; store.set("jobs.filter", filter); render(); });
document.querySelector(".seg-mini").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (!b) return; view = b.dataset.v; store.set("jobs.view", view); render(); });
$("q").addEventListener("input", render);

document.addEventListener("click", e => {
  const q = e.target.closest("[data-q]");
  if (q) {
    const id = q.dataset.id; const j = jobs().find(x => x.id === id); if (!j) return;
    if (q.dataset.q === "status") { if (j.status !== q.dataset.s) queue(id, { status: q.dataset.s }); }
    else if (q.dataset.q === "inc" || q.dataset.q === "dec") {
      const st = { ...j.stages }; const k = q.dataset.k;
      st[k] = Math.max(0, Math.min(99, st[k] + (q.dataset.q === "inc" ? 1 : -1)));
      if (st[k] !== j.stages[k]) queue(id, { stages: st });
    }
    else if (q.dataset.q === "edit") openSheet(j);
    return;
  }
  const row = e.target.closest(".row[data-id]");
  if (row) {
    const id = row.dataset.id;
    if (row.dataset.jump) {
      if (filter !== "open") filter = "open";
      openId = id; render();
      const target = document.querySelector(`#list .row[data-id="${CSS.escape(id)}"]`);
      if (target) target.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" });
      return;
    }
    openId = openId === id ? null : id; render();
  }
});

// Large title collapses into the nav bar
new IntersectionObserver(([en]) => $("nav").classList.toggle("solid", !en.isIntersecting), { rootMargin: "-60px 0px 0px 0px" }).observe(document.querySelector("#hero h1"));

/* ---------- sheet ---------- */
function paintForm() {
  $("f-status").innerHTML = STATUSES.map(s => `<button type="button" data-fs="${s.key}" data-s="${s.key}" aria-pressed="${form.status === s.key}">${s.label}</button>`).join("");
  $("f-stages").innerHTML = STAGES.map(st => `<div class="stage"><small>${st.label}</small><div class="stepper">
    <button type="button" data-fk="${st.key}" data-d="-1" aria-label="${st.label} פחות">−</button><b>${form.stages[st.key]}</b><button type="button" data-fk="${st.key}" data-d="1" aria-label="${st.label} יותר">+</button></div></div>`).join("");
}
$("f-status").addEventListener("click", e => { const b = e.target.closest("[data-fs]"); if (b) { form.status = b.dataset.fs; paintForm(); } });
$("f-stages").addEventListener("click", e => { const b = e.target.closest("[data-fk]"); if (!b) return; const k = b.dataset.fk; form.stages[k] = Math.max(0, Math.min(99, form.stages[k] + Number(b.dataset.d))); paintForm(); });

function openSheet(j) {
  editing = j || null;
  $("sheetTitle").textContent = j ? "עריכה" : "משרה חדשה";
  $("f-company").value = j?.company || "";
  $("f-role").value = j?.role || "";
  $("f-location").value = j?.location || "";
  $("f-link").value = j?.link || "";
  $("f-memo").value = j?.memo || "";
  $("f-hot").checked = !!j?.hot;
  form = { status: j?.status || "active", stages: { ...(j?.stages || { outreach: 0, interview: 0, offer: 0 }) } };
  paintForm();
  $("delBtn").hidden = !j || readOnly; $("confirmDel").hidden = true;
  $("save").disabled = readOnly;
  $("scrim").hidden = false; $("sheet").hidden = false;
  requestAnimationFrame(() => { $("scrim").classList.add("show"); $("sheet").classList.add("show"); });
}
function closeSheet() {
  $("scrim").classList.remove("show"); $("sheet").classList.remove("show");
  setTimeout(() => { $("scrim").hidden = true; $("sheet").hidden = true; }, 300);
  editing = null;
}
$("fab").onclick = () => openSheet(null);
$("cancel").onclick = closeSheet; $("scrim").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });
$("delBtn").onclick = () => { $("confirmDel").hidden = false; $("delBtn").hidden = true; };
$("delNo").onclick = () => { $("confirmDel").hidden = true; $("delBtn").hidden = false; };
$("delYes").onclick = () => {
  if (!mcp || !editing) return;
  queue(editing.id, { status: "closed" }); closeSheet(); toast("המשרה סומנה כנסגרה");
};
$("form").addEventListener("submit", async e => {
  e.preventDefault();
  if (!mcp) { toast("הלוח עוד לא מחובר ל-Notion"); return; }
  const now = new Date().toISOString();
  const body = {
    company: $("f-company").value.trim(), role: $("f-role").value.trim(), status: form.status,
    location: $("f-location").value.trim(), link: $("f-link").value.trim(), memo: $("f-memo").value.trim(),
    hot: $("f-hot").checked, stages: form.stages,
    candidates: form.stages.outreach + form.stages.interview + form.stages.offer, updatedAt: now,
  };
  if (!body.company || !body.role) { toast("צריך חברה ותפקיד"); return; }
  $("save").disabled = true;
  const wasEdit = !!editing;
  try {
    if (editing) {
      const id = editing.id; delete pending[id];
      await mcp.callTool(NOTION, "notion-update-page", { page_id: id, command: "update_properties", properties: toProps(body), allow_async: false });
      raw = raw.map(j => j.id === id ? { ...j, ...body } : j);
    } else {
      const res = await mcp.callTool(NOTION, "notion-create-pages", { parent: { data_source_id: DS_ID }, pages: [{ properties: toProps(body) }], allow_async: false });
      const created = res?.payload?.pages?.[0];
      if (created) { raw = [...raw, { ...body, id: pageId(created.id || created.url) }]; openId = pageId(created.id || created.url); }
    }
    closeSheet(); toast(wasEdit ? "נשמר ב-Notion" : "המשרה נוספה ל-Notion"); render(); refreshNow();
  } catch (err) { toast(errText(err)); }
  finally { $("save").disabled = readOnly; }
});

render();

function showBanner(msg, action) {
  const b = $("banner");
  b.innerHTML = `${esc(msg)}${action ? ` <button type="button" class="tbtn" id="bannerBtn" style="margin-inline-start:8px">${esc(action)}</button>` : ""}`;
  b.hidden = false;
  return action ? $("bannerBtn") : null;
}
let unwatch = null;
function startWatch() {
  if (unwatch) return;
  unwatch = mcp.watchTool(NOTION, "notion-query-data-sources", QUERY_INPUT, ev => {
    if (ev.type === "data") { applyRows(ev.result?.payload); return; }
    const code = ev.error?.code;
    if (["needs_reauth", "server_not_connected", "blocked_by_policy", "approval_required", "not_in_manifest"].includes(code)) {
      raw = []; loaded = true; render(); askToConnect(code);
    } else if (code === "bad_request" || code === "capability_removed") {
      // Older shell without watch: poll by hand once a minute.
      unwatch = null; setInterval(() => loadOnce(true), 60000);
    } else if (!raw.length) {
      loaded = true; render(); showBanner("Notion לא עונה כרגע. הלוח ינסה שוב לבד.");
    }
  }, { refetchInterval: 60000, cache: { staleTime: 15000, gcTime: 600000 } });
}
async function loadOnce(quiet) {
  try {
    const res = await mcp.callTool(NOTION, "notion-query-data-sources", QUERY_INPUT, { cache: { refresh: true, staleTime: 15000, gcTime: 600000 } });
    if (!applyRows(res?.payload) && !quiet) { loaded = true; render(); showBanner("התשובה מ-Notion לא בפורמט הצפוי."); }
    return true;
  } catch (e) {
    loaded = true; render();
    if (!quiet) askToConnect(e?.code);
    return false;
  }
}
function askToConnect(code) {
  const msg = errText({ code });
  const btn = showBanner(msg, code === "approval_required" || code === "not_in_manifest" || code === "upstream_error" ? "חיבור ל-Notion" : null);
  if (btn) btn.onclick = async () => { if (await loadOnce()) { $("banner").hidden = true; startWatch(); } };
}

(async () => {
  mcp = await (window.claude?.use ? window.claude.use("mcp") : Promise.resolve(null));
  if (!mcp) {
    loaded = true; render();
    showBanner("הלוח זמין רק כשפותחים אותו מתוך Claude עם החשבון שלך.");
    $("fab").hidden = true; return;
  }
  const timer = setTimeout(() => { if (!loaded) showBanner("Notion איטי כרגע. הלוח ממשיך לנסות."); }, 10000);
  const ok = await loadOnce();
  clearTimeout(timer);
  if (ok) startWatch();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshNow(); });
})();
</script>
