<style>
/* layout: two views over one shared decision store. #swipe = one card at a time for the phone; #web = sortable table for the desk */
:root{--bg:#0f1418;--sf:#172027;--sf2:#1e2a33;--ln:#2a3742;--fg:#e6edf2;--mu:#8fa1ae;--ac:#5fb3c9;--A:#7fcf8f;--B:#e0c36a;--C:#7d8790;--no:#d9786b;--mb:#b59be0;--fn:'Heebo',system-ui,-apple-system,sans-serif;color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f3f6f8;--sf:#ffffff;--sf2:#eaf0f3;--ln:#d3dde3;--fg:#15202a;--mu:#5a6b78;--ac:#1f7f99;--A:#2e8b47;--B:#9a7a12;--C:#7a848c;--no:#b5463a;--mb:#6f4fb0;color-scheme:light}}
:root[data-theme="light"]{--bg:#f3f6f8;--sf:#ffffff;--sf2:#eaf0f3;--ln:#d3dde3;--fg:#15202a;--mu:#5a6b78;--ac:#1f7f99;--A:#2e8b47;--B:#9a7a12;--C:#7a848c;--no:#b5463a;--mb:#6f4fb0;color-scheme:light}
html{direction:rtl}
body{background:var(--bg);color:var(--fg);font-family:var(--fn);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;overflow-x:hidden}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
body.web .wrap{max-width:1280px}
h1{font-size:19px;font-weight:800;margin:0;text-wrap:balance}
.sub{color:var(--mu);font-size:13px;margin:0}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
header>div{min-width:0;flex:1}
.tabs{display:flex;gap:4px;background:var(--sf2);border-radius:10px;padding:3px}
.tabs a{color:var(--mu);text-decoration:none;font-size:13px;font-weight:700;padding:5px 12px;border-radius:8px}
.tabs a[aria-current="page"]{background:var(--sf);color:var(--fg)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--ln);background:var(--sf);color:var(--fg);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--bg);font-weight:700}
.chip:focus-visible,.act:focus-visible,.lnk:focus-visible,.ib:focus-visible,th button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.sync{font-size:12px;color:var(--mu);margin-inline-start:auto}
.kpi{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mu);font-variant-numeric:tabular-nums}
.kpi b{color:var(--fg);font-size:15px}
.prog{display:flex;flex-direction:column;gap:4px}
.pbar{height:6px;background:var(--sf2);border-radius:99px;overflow:hidden;display:flex}
.pbar i{display:block;height:100%}
.deck{position:relative;height:min(620px,calc(100dvh - 210px));min-height:480px;touch-action:none;overscroll-behavior:contain}
html,body{overflow-x:clip;max-width:100%}
.card{position:absolute;inset:0;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;user-select:none;will-change:transform;overflow:hidden}
.card.under{transform:scale(.95) translateY(10px);opacity:.6;pointer-events:none}
.card.anim{transition:transform .28s ease,opacity .28s ease}
.stamp{position:absolute;top:18px;font-weight:800;font-size:22px;padding:2px 10px;border:3px solid;border-radius:8px;opacity:0;pointer-events:none}
.stamp.y{left:16px;color:var(--A);border-color:var(--A);transform:rotate(-12deg)}
.stamp.n{right:16px;color:var(--no);border-color:var(--no);transform:rotate(12deg)}
.stamp.m{left:50%;transform:translateX(-50%);color:var(--mb);border-color:var(--mb)}
.top{display:flex;gap:10px;align-items:center}
.g{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none;color:var(--bg)}
.g.A{background:var(--A)}.g.B{background:var(--B)}.g.C{background:var(--C)}
.nm{font-size:18px;font-weight:800;overflow-wrap:anywhere}
.avw{position:relative;flex:none;width:64px;height:64px}
.av{width:64px;height:64px;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:var(--sf2);color:var(--mu);font-weight:800;font-size:20px;border:1px solid var(--ln)}
.avw .g{position:absolute;bottom:-4px;left:-4px;width:24px;height:24px;font-size:12px;border:2px solid var(--sf)}
.cur{color:var(--mu);font-size:14px;overflow-wrap:anywhere}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0;font-size:14px}
dt{color:var(--mu);font-size:12px;padding-top:2px;white-space:nowrap}
dd{margin:0;min-width:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.why{background:var(--sf2);border-radius:10px;padding:8px 12px;font-size:13.5px;overflow-wrap:anywhere;flex:none}
.why .wc{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden}
.tl{display:flex;flex-direction:column;gap:3px;font-size:13px;min-width:0;direction:ltr;text-align:left}
.tl div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .dt{color:var(--mu);font-variant-numeric:tabular-nums;display:inline-block;min-width:84px;unicode-bidi:isolate}
.tl .co{color:var(--mu)}
.hs{font-size:12.5px;color:var(--mu);border-inline-start:3px solid var(--ac);padding:2px 10px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;flex:none}
.cbot{margin-top:auto;display:flex;gap:8px;align-items:center;justify-content:space-between;flex:none}
.mbtn{border:1px solid var(--ln);background:var(--sf2);color:var(--fg);border-radius:9px;padding:7px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
#sheet{position:fixed;inset:0;z-index:30;display:none}
#sheet.on{display:block}
#sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#sheet .pn{position:absolute;inset-inline:0;bottom:0;max-height:88dvh;overflow:auto;overscroll-behavior:contain;background:var(--sf);border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-width:640px;margin:0 auto}
#sheet h3{margin:0;font-size:13px;color:var(--mu);font-weight:700}
#sheet .tl div{white-space:normal}
#sheet .x{position:sticky;top:0;align-self:flex-start;border:1px solid var(--ln);background:var(--sf2);color:var(--fg);border-radius:9px;padding:4px 12px;font:inherit;cursor:pointer}
.ninf{all:unset;cursor:pointer;color:var(--ac);font-size:13px;margin-inline-start:6px}
.xs{font-size:12px;font-weight:700;color:var(--ac)}
.lnk{margin-top:auto;align-self:flex-start;color:var(--ac);font-weight:700;text-decoration:none;font-size:14px;padding:6px 0}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 48px;gap:6px}
.act{border:1px solid var(--ln);background:var(--sf);color:var(--fg);border-radius:12px;padding:12px 4px;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.act.y{color:var(--A);border-color:var(--A)}.act.n{color:var(--no);border-color:var(--no)}.act.m{color:var(--mb);border-color:var(--mb)}.act.c{color:var(--ac);border-color:var(--ac)}
.act:disabled{opacity:.4;cursor:default}
.hint{font-size:12px;color:var(--mu);text-align:center;margin:0}
.done{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--mu);border:1px dashed var(--ln);border-radius:16px;padding:20px}
details{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}
summary{cursor:pointer;font-weight:700;font-size:14px}
.list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.li{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.li a{color:var(--fg);text-decoration:none;min-width:0;overflow-wrap:anywhere}
.li .t{color:var(--mu);font-size:12px;margin-inline-start:auto;white-space:nowrap}
.li button{border:1px solid var(--ln);background:var(--sf2);color:var(--mu);border-radius:7px;font:inherit;font-size:12px;padding:2px 8px;cursor:pointer}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.bulk{border:1px solid var(--ln);background:var(--sf2);color:var(--fg);border-radius:9px;padding:9px;font:inherit;font-size:14px;cursor:pointer;width:100%;margin-top:8px}
.tz{background:var(--sf2);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:8px;overflow-wrap:anywhere}
.notes{font-size:13px}.notes ul{margin:6px 0 0;padding-inline-start:18px;display:flex;flex-direction:column;gap:3px}
/* web view */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input{background:var(--sf);border:1px solid var(--ln);color:var(--fg);border-radius:9px;padding:7px 10px;font:inherit;font-size:14px;min-width:0;flex:1 1 200px;max-width:320px}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:12px;background:var(--sf)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:900px}
th{position:sticky;top:0;background:var(--sf2);text-align:right;font-size:12px;color:var(--mu);font-weight:700;white-space:nowrap}
th button{all:unset;cursor:pointer;display:block;padding:8px 10px}
th button[data-dir]::after{content:attr(data-dir);margin-inline-start:4px;color:var(--ac)}
td{padding:8px 10px;border-top:1px solid var(--ln);vertical-align:top}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
td a{color:var(--fg);font-weight:700;text-decoration:none}
td a:hover{color:var(--ac)}
td .w{color:var(--mu);font-size:13px;min-width:260px;max-width:420px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;cursor:pointer}
td .t2{max-width:220px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
td .w.open{display:block;-webkit-line-clamp:unset;line-clamp:none}

@media (max-width:700px){td{padding:6px 8px}td .w,td .t2{-webkit-line-clamp:1;line-clamp:1}td a{white-space:nowrap}td .xs{display:block;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}td .w{min-width:200px}td .t2{max-width:160px}table{font-size:13px}}
.gp{display:inline-block;min-width:22px;text-align:center;border-radius:6px;font-weight:800;font-size:12px;color:var(--bg);padding:1px 6px}
.gp.A{background:var(--A)}.gp.B{background:var(--B)}.gp.C{background:var(--C)}
.ibs{display:flex;gap:4px;white-space:nowrap}
.ib{border:1px solid var(--ln);background:var(--sf2);color:var(--mu);border-radius:7px;font:inherit;font-size:13px;padding:2px 8px;cursor:pointer}
.ib[aria-pressed="true"].fit{background:var(--A);border-color:var(--A);color:var(--bg)}
.ib[aria-pressed="true"].maybe{background:var(--mb);border-color:var(--mb);color:var(--bg)}
.ib[aria-pressed="true"].no{background:var(--no);border-color:var(--no);color:var(--bg)}
.ib[aria-pressed="true"].connect{background:var(--ac);border-color:var(--ac);color:var(--bg)}
tr.dim td{opacity:.55}
.empty{padding:24px;text-align:center;color:var(--mu)}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){.card.anim,#toast{transition:none}}
</style>

</div>

function bindDrag(){
  const el=document.querySelector('#deck .card:not(.under)');if(!el)return;
  /* the deck has touch-action:none, so the browser never scrolls/pans while a finger is on the card:
     one pointer stream for mouse+touch, painted once per frame. page scroll still works outside the card. */
  let x0=0,y0=0,dx=0,dy=0,on=false,raf=0,pid=null;
  const under=document.querySelector('#deck .card.under');
  const sY=el.querySelector('.stamp.y'),sN=el.querySelector('.stamp.n'),sM=el.querySelector('.stamp.m');
  const paint=()=>{raf=0;const up=Math.min(dy,0);
    el.style.transform=`translate3d(${dx}px,${up}px,0) rotate(${dx/20}deg)`;
    sY.style.opacity=Math.min(1,Math.max(0,dx/80));sN.style.opacity=Math.min(1,Math.max(0,-dx/80));
    sM.style.opacity=Math.abs(dx)<50?Math.min(1,Math.max(0,-up/80)):0;
    if(under){const p=Math.min(1,Math.hypot(dx,up)/120);under.style.transform=`scale(${.95+.05*p}) translateY(${10-10*p}px)`;under.style.opacity=.6+.4*p}};
  const req=()=>{if(!raf)raf=requestAnimationFrame(paint)};
  const reset=()=>{el.classList.add('anim');el.style.transform='';[sY,sN,sM].forEach(s=>s.style.opacity=0);
    if(under){under.classList.add('anim');under.style.transform='';under.style.opacity=''}
    setTimeout(()=>{el.classList.remove('anim');under&&under.classList.remove('anim')},300)};
  el.addEventListener('pointerdown',e=>{if(on||e.target.closest('a,button'))return;on=true;pid=e.pointerId;x0=e.clientX;y0=e.clientY;dx=dy=0;
    el.classList.remove('anim');DRAG=true;try{el.setPointerCapture(pid)}catch(_){}});
  el.addEventListener('pointermove',e=>{if(!on||e.pointerId!==pid)return;dx=e.clientX-x0;dy=e.clientY-y0;req()});
  const end=e=>{if(!on||e.pointerId!==pid)return;on=false;DRAG=false;if(raf){cancelAnimationFrame(raf);raf=0}
    const w=el.offsetWidth||360,th=Math.min(90,w*.22);
    if(dx>th)fly('fit');else if(dx<-th)fly('no');else if(dy<-90&&Math.abs(dx)<50)fly('maybe');else{reset();if(PEND)setTimeout(renderSwipe,320)}};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}

/* ---- Notion: shared with the iPhone app and every Claude session ---- */
const NX={on:false,mcp:null,ids:{},
  DS:'collection://0adba494-d721-44c2-8fb8-9df400a6c1da',
  TO:{fit:'מתאים',maybe:'אולי',no:'לא',connect:'חיבור'},
  FROM:{'מתאים':'fit','אולי':'maybe','לא':'no','חיבור':'connect'}};
NX.Q={data:{data_source_urls:[NX.DS],query:`SELECT url, "Key", "Decision", "date:Decided:start" FROM "${NX.DS}" WHERE "Mine" = ?`,params:[M.mid]}};
function nErr(e){const c=e&&e.code;
  if(c==='needs_reauth'||c==='server_not_connected')return 'צריך לחבר את Notion בהגדרות Claude › Connectors';
  if(c==='approval_required'||c==='not_in_manifest')return 'המכרה צריך אישור לגשת ל-Notion';
  return 'השמירה ב-Notion לא הושלמה, כדאי לבדוק שם'}
function nApply(p){const rows=p&&Array.isArray(p.results)?p.results:null;if(!rows)return false;
  const n={};rows.forEach(r=>{const m=String(r.url||'').match(/([0-9a-f]{32})/i);if(r.Key&&m)NX.ids[r.Key]=m[1];
    const s=NX.FROM[r.Decision];if(r.Key&&s){const d=D.find(x=>x.k===r.Key);n[sid(r.Key)]={s,d:String(r['date:Decided:start']||'').slice(0,10),n:d?d.n:r.Key,g:d?d.g:'',u:d?d.u:'',k:r.Key}}});
  S=n;cache();render();$('sync').textContent='✓ מסונכרן עם Notion';return true}
async function nSave(k,a){const pid=NX.ids[k];if(!pid)throw {code:'missing'};
  const props={Decision:a?NX.TO[a]:null,'Decided by':'אדם (מכרה במחשב)'};
  if(a){props['date:Decided:start']=new Date().toISOString().slice(0,10);props['date:Decided:is_datetime']=0}else{props['date:Decided:start']=null}
  await NX.mcp.callTool('Notion','notion-update-page',{page_id:pid,command:'update_properties',properties:props,allow_async:false});
  try{await NX.mcp.invalidate('Notion','notion-query-data-sources')}catch(e){}}
async function nBoot(){
  try{NX.mcp=await window.claude?.use?.('mcp')}catch(e){NX.mcp=null}
  if(!NX.mcp)return false;
  try{const r=await NX.mcp.callTool('Notion','notion-query-data-sources',NX.Q,{cache:{refresh:true,staleTime:10000,gcTime:600000}});
    if(!nApply(r&&r.payload)||!Object.keys(NX.ids).length)return false}catch(e){return false}
  NX.on=true;
  NX.mcp.watchTool('Notion','notion-query-data-sources',NX.Q,ev=>{if(ev.type==='data')nApply(ev.result&&ev.result.payload)},{refetchInterval:30000,cache:{staleTime:10000,gcTime:600000}});
  addEventListener('visibilitychange',()=>{if(!document.hidden)NX.mcp.invalidate('Notion','notion-query-data-sources').catch(()=>{})});
  return true}
(async()=>{
  const sy=$('sync');
  sy.textContent='מתחבר ל-Notion…';
  if(await nBoot())return;
  const tm=setTimeout(()=>{if(!db)sy.textContent='שמירה מקומית בלבד'},10000);
  try{db=await window.claude?.use?.('db')}catch(e){db=null}
  if(!db){clearTimeout(tm);sy.textContent='שמירה מקומית בלבד';return}
  db.collection('screen').onSnapshot(snap=>{clearTimeout(tm);const n={};snap.docs.forEach(x=>{const v=x.data();if(v&&v.s)n[x.id]=v});S=n;cache();render();sy.textContent='✓ נשמר בענן'},()=>{clearTimeout(tm);sy.textContent='שמירה מקומית בלבד';db=null});
})();
