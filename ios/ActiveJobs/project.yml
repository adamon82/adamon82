name: ActiveJobs
options:
  bundleIdPrefix: app.activejobs
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: he
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "F8WHK8WM4K"
    CODE_SIGN_STYLE: Automatic
targets:
  ActiveJobs:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.activejobs.ActiveJobs
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: משרות
        CFBundleDevelopmentRegion: he
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: ActiveJobsWidget
      - target: ShareToJobs
  ActiveJobsWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.activejobs.ActiveJobs.Widget
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: משרות
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  ShareToJobs:
    type: app-extension
    platform: iOS
    sources: [Share, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.activejobs.ActiveJobs.Share
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: משרות
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
schemes:
  ActiveJobs:
    build:
      targets:
        ActiveJobs: all
        ActiveJobsWidget: all
        ShareToJobs: all
    run:
      config: Debug
    archive:
      config: Release
